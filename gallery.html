<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery | Gelisanga</title>
  <meta name="description" content="A glimpse into the life of Kent Adrian P. Gelisanga: photos of interests, projects and experiences.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <!-- styles.css = shared palette, header and navigation; gallery.css = this page only -->
  <style>
/* ==========================================================
   Gelisanga personal site
   1. Variables  2. Base  3. Header  4. Hero  5. Sections
   6. Skills & Projects  7. Interests  8. Contact  9. Footer
   10. Responsive & motion
   ========================================================== */

/* ---------- 1. VARIABLES (edit the palette here) ---------- */
:root {
  --bg: #050505;
  --bg-2: #0a0f10;
  --cyan: #00ffff;
  --cyan-dark: #008b8b;
  --cyan-light: #7fffff;
  --text: #f5f5f5;
  --text-2: #9ca3af;

  --border: rgba(0, 255, 255, 0.18);
  --glow: 0 0 18px rgba(0, 255, 255, 0.35);
  --glow-strong: 0 0 28px rgba(0, 255, 255, 0.6);
  --gradient: linear-gradient(135deg, var(--cyan), #00b4d8);

  --font-head: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
  --max: 1100px;
}

/* ---------- 2. BASE ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 400 1.0625rem/1.7 var(--font-body);
}
h1, h2, h3 { font-family: var(--font-head); line-height: 1.15; margin: 0; }
p { margin: 0 0 1rem; }
ul { list-style: none; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--cyan-light);
  outline-offset: 3px;
}

/* ---------- 3. HEADER ---------- */
.navbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; justify-content: space-between; align-items: center;
  gap: 1rem; padding: 0.4rem clamp(1rem, 5vw, 3rem);
  background: rgba(5, 5, 5, 0.8);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; }
.logo img {
  display: block; height: clamp(56px, 7vw, 76px); width: auto; max-width: 60vw; /* auto width keeps the original proportions */
  filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.25));
  transition: filter 0.3s, transform 0.3s;
}
.logo:hover img, .logo:focus-visible img { filter: drop-shadow(0 0 14px rgba(0, 255, 255, 0.65)); transform: scale(1.03); }

/* Hamburger button (hidden on desktop) */
.nav-toggle { position: absolute; opacity: 0; pointer-events: none; }
.burger { display: none; width: 44px; height: 44px; position: relative; cursor: pointer; border: 1px solid var(--border); border-radius: 10px; transition: box-shadow 0.2s, border-color 0.2s; }
.burger:hover { border-color: var(--cyan); box-shadow: var(--glow); }
.nav-toggle:focus-visible + .burger { outline: 2px solid var(--cyan-light); outline-offset: 3px; }
.burger span, .burger span::before, .burger span::after {
  content: ""; position: absolute; left: 11px; width: 20px; height: 2px;
  background: var(--cyan); border-radius: 2px; transition: transform 0.25s, opacity 0.25s;
}
.burger span { top: 21px; }
.burger span::before { left: 0; top: -7px; }
.burger span::after { left: 0; top: 7px; }
.nav-toggle:checked + .burger span { background: transparent; }
.nav-toggle:checked + .burger span::before { transform: translateY(7px) rotate(45deg); }
.nav-toggle:checked + .burger span::after { transform: translateY(-7px) rotate(-45deg); }

/* Navigation links (same on every page; every link has the same padding and border so nothing shifts) */
.nav-links { display: flex; align-items: center; gap: 0.2rem; }
.nav-links a {
  display: block; padding: 0.4rem 0.9rem; border: 1px solid transparent; border-radius: 999px;
  color: var(--cyan-light); font: 500 0.95rem var(--font-body); letter-spacing: 0.02em; white-space: nowrap;
  transition: color 0.2s, background 0.2s, border-color 0.2s, box-shadow 0.2s, text-shadow 0.2s;
}
.nav-links a:hover, .nav-links a:focus-visible {
  color: var(--cyan); border-color: rgba(0, 255, 255, 0.3);
  text-shadow: 0 0 10px rgba(0, 255, 255, 0.8); box-shadow: 0 0 14px rgba(0, 255, 255, 0.22);
}
/* Current page: the only highlighted link */
.nav-links a.active {
  color: var(--cyan); background: rgba(0, 255, 255, 0.1); border-color: rgba(0, 255, 255, 0.55);
  text-shadow: 0 0 10px rgba(0, 255, 255, 0.7); box-shadow: var(--glow);
}

/* Tablet and mobile: links collapse into the hamburger menu */
@media (max-width: 900px) {
  .burger { display: block; }
  .navbar nav { position: absolute; top: 100%; left: 0; right: 0; }
  .nav-links {
    display: none; flex-direction: column; align-items: stretch; gap: 0.25rem;
    padding: 0.75rem clamp(1rem, 5vw, 3rem) 1rem;
    background: rgba(5, 5, 5, 0.97); border-bottom: 1px solid var(--border);
  }
  .nav-toggle:checked ~ nav .nav-links { display: flex; }
  .nav-links a { padding: 0.85rem 1rem; border-radius: 10px; font-size: 1.05rem; }
}

/* ---------- 4. HERO (profile banner) ---------- */
.hero {
  padding: clamp(1rem, 3vw, 2rem) clamp(0.75rem, 3vw, 2rem) clamp(2.5rem, 6vw, 4.5rem);
  background:
    radial-gradient(ellipse 60% 40% at 50% 0%, rgba(0, 255, 255, 0.12), transparent 70%);
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.banner {
  max-width: 1600px; margin: 0 auto; overflow: hidden;
  border: 1px solid var(--border); border-radius: clamp(12px, 2vw, 22px);
  box-shadow: 0 0 0 1px rgba(0, 255, 255, 0.06), 0 0 36px rgba(0, 255, 255, 0.22), 0 18px 50px rgba(0, 0, 0, 0.6);
  transition: box-shadow 0.4s, border-color 0.4s;
}
.banner:hover { border-color: rgba(0, 255, 255, 0.5); box-shadow: 0 0 0 1px rgba(0, 255, 255, 0.15), 0 0 52px rgba(0, 255, 255, 0.38), 0 18px 50px rgba(0, 0, 0, 0.6); }
/* Height stays automatic, so the image keeps its original proportions at every size */
.banner img { display: block; width: 100%; height: auto; transition: transform 0.8s ease; }
.banner:hover img { transform: scale(1.015); }
.hero-intro { max-width: var(--max); margin: clamp(2rem, 5vw, 3.5rem) auto 0; padding-inline: clamp(0.25rem, 2vw, 1rem); }
.hero-sub { color: var(--cyan-light); font: 500 clamp(1.1rem, 2.5vw, 1.4rem) var(--font-head); margin-bottom: 0.5rem; }
.hero-text { max-width: 52ch; color: var(--text-2); margin-bottom: 1.75rem; }

/* Buttons (shared by hero, projects and form) */
.btn {
  display: inline-block; cursor: pointer;
  padding: 0.85rem 1.9rem; border-radius: 999px;
  background: var(--gradient); color: #031416;
  font: 700 1rem var(--font-head);
  border: 0; box-shadow: var(--glow);
  transition: transform 0.25s, box-shadow 0.25s;
}
.btn:hover { transform: translateY(-3px); box-shadow: var(--glow-strong); }
.btn-small {
  padding: 0.5rem 1.2rem; font-size: 0.9rem;
  background: transparent; color: var(--cyan);
  border: 1px solid var(--cyan); box-shadow: none;
}
.btn-small:hover { background: rgba(0, 255, 255, 0.1); box-shadow: var(--glow); }

/* ---------- 5. SECTIONS ---------- */
.section { max-width: var(--max); margin: 0 auto; padding: 5rem clamp(1rem, 5vw, 3rem); }
.section h2 {
  font-size: clamp(2rem, 5vw, 2.75rem);
  margin-bottom: 2.5rem; padding-bottom: 0.75rem;
  border-bottom: 2px solid transparent;
  border-image: linear-gradient(90deg, var(--cyan), transparent 40%) 1;
}
.about-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 3rem; align-items: start; }
.about-text { color: var(--text-2); }
.about-facts { display: grid; gap: 1rem; }
.about-facts li {
  padding: 1.1rem 1.3rem; color: var(--text-2);
  background: var(--bg-2); border: 1px solid var(--border);
  border-left: 3px solid var(--cyan); border-radius: var(--radius);
}
.about-facts strong { display: block; color: var(--text); font-family: var(--font-head); }

/* ---------- 6. SKILLS & PROJECTS ---------- */
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
.card {
  padding: 1.75rem; background: var(--bg-2);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
}
.card:hover { transform: translateY(-6px); border-color: var(--cyan); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), var(--glow); }
.card h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
.card p { color: var(--text-2); font-size: 0.98rem; }
.icon {
  width: 38px; height: 38px; margin-bottom: 1rem;
  fill: none; stroke: var(--cyan); stroke-width: 1.7;
  stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.55));
  transition: transform 0.3s;
}
.card:hover .icon { transform: scale(1.12); }
.project { display: flex; flex-direction: column; align-items: flex-start; }
.project p { flex: 1; }
.tag {
  margin-bottom: 1rem; padding: 0.2rem 0.75rem; border-radius: 999px;
  font-size: 0.8rem; color: var(--cyan-light);
  background: rgba(0, 255, 255, 0.08); border: 1px solid var(--border);
}

/* ---------- 7. INTERESTS ---------- */
.interests { display: flex; flex-wrap: wrap; gap: 1rem; }
.interests li {
  padding: 1rem 2rem; border-radius: 999px;
  font: 500 1.3rem var(--font-head);
  background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 139, 139, 0.06));
  border: 1px solid var(--border);
  transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
}
.interests li:hover { transform: translateY(-4px); border-color: var(--cyan); box-shadow: var(--glow); }

/* ---------- 8. CONTACT ---------- */
.contact-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 3rem; align-items: start; }
.form { display: grid; gap: 0.5rem; }
.form label { font-size: 0.95rem; color: var(--text-2); }
.form input, .form textarea {
  width: 100%; padding: 0.85rem 1rem; margin-bottom: 0.75rem;
  background: var(--bg-2); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px;
  font: inherit; transition: border-color 0.2s, box-shadow 0.2s;
}
.form input:focus, .form textarea:focus { outline: none; border-color: var(--cyan); box-shadow: var(--glow); }
.form .btn { justify-self: start; }
.socials p { color: var(--text-2); }
.socials ul { display: grid; gap: 0.75rem; }
.socials a {
  display: block; padding: 0.8rem 1.2rem; border-radius: 10px;
  background: var(--bg-2); border: 1px solid var(--border);
  transition: transform 0.25s, border-color 0.25s, box-shadow 0.25s, color 0.25s;
}
.socials a:hover { transform: translateX(6px); color: var(--cyan-light); border-color: var(--cyan); box-shadow: var(--glow); }

/* ---------- 9. FOOTER ---------- */
.site-footer {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem;
  padding: 2rem clamp(1rem, 5vw, 3rem);
  background: var(--bg-2); border-top: 1px solid var(--border);
  color: var(--text-2); font-size: 0.95rem;
}
.site-footer p { margin: 0; }
.footer-nav { display: flex; gap: 1.5rem; }
.footer-nav a:hover { color: var(--cyan-light); }

/* ---------- 10. RESPONSIVE & MOTION ---------- */
@media (max-width: 760px) {
  .logo img { height: 56px; }
  .about-grid, .contact-grid { grid-template-columns: 1fr; gap: 2rem; }
  .section { padding-block: 3.5rem; }
  .form .btn { justify-self: stretch; text-align: center; }
  .site-footer { flex-direction: column; }
}

/* Single page-load sequence for the hero */
@keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
.banner, .hero-intro { animation: rise 0.8s ease both; }
.hero-intro { animation-delay: 0.2s; }

/* Subtle scroll reveal for section headings (browsers that support it) */
@supports (animation-timeline: view()) {
  .section h2 { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 40%; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Particle background (see particles-bg.js) ----------
   z-index -1 keeps it behind all content; cards, header and footer stay solid on top of it */
#particles-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
</style>

  <script>
(function(){
var run=function(){
/* Particle background for GELISANGA.
   A small canvas version of the particles.js effect, so no outside library is needed:
   cyan dots drift slowly, connect with thin lines when close, move away from the cursor,
   and a click on empty space adds a few more. Tune everything in CONFIG below. */
(function () {
  'use strict';

  var CONFIG = {
    color: '0, 255, 255',   // particle and line color as r, g, b
    density: 16000,         // screen pixels per particle (smaller number = more particles)
    min: 28,                // fewest particles (small screens)
    max: 90,                // most particles (large screens)
    size: [1, 2.6],         // dot radius range in px
    speed: 0.35,            // fastest drift in px per frame
    opacity: 0.55,          // dot opacity
    linkDistance: 140,      // lines appear between dots closer than this
    linkOpacity: 0.28,      // line opacity at its strongest
    repulseRadius: 150,     // how far the cursor pushes dots away
    repulseForce: 2.2,      // how hard it pushes
    clickAdd: 3,            // dots added per click
    maxExtra: 120           // cap on dots added by clicking
  };

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function start() {
    var canvas = document.createElement('canvas');
    canvas.id = 'particles-bg';
    canvas.setAttribute('aria-hidden', 'true');
    document.body.insertBefore(canvas, document.body.firstChild);
    var ctx = canvas.getContext('2d');
    if (!ctx) { return; }

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = 0, h = 0, parts = [], raf = 0;
    var pointer = { x: -9999, y: -9999, on: false };

    function rand(a, b) { return a + Math.random() * (b - a); }

    function make(x, y) {
      var angle = Math.random() * Math.PI * 2;
      var speed = rand(CONFIG.speed * 0.3, CONFIG.speed);
      return { x: x, y: y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, r: rand(CONFIG.size[0], CONFIG.size[1]) };
    }

    function wanted() {
      return Math.max(CONFIG.min, Math.min(CONFIG.max, Math.round((w * h) / CONFIG.density)));
    }

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = wanted();
      while (parts.length < n) { parts.push(make(rand(0, w), rand(0, h))); }
      if (parts.length > n + CONFIG.maxExtra) { parts.length = n + CONFIG.maxExtra; }
      draw();
    }

    function step() {
      var R = CONFIG.repulseRadius, p, dx, dy, d, f;
      for (var i = 0; i < parts.length; i++) {
        p = parts[i];
        p.x += p.vx;
        p.y += p.vy;
        // leaving one edge re-enters from the opposite edge
        if (p.x < -10) { p.x = w + 10; } else if (p.x > w + 10) { p.x = -10; }
        if (p.y < -10) { p.y = h + 10; } else if (p.y > h + 10) { p.y = -10; }
        if (pointer.on) {
          dx = p.x - pointer.x;
          dy = p.y - pointer.y;
          d = Math.sqrt(dx * dx + dy * dy);
          if (d < R && d > 0.1) {
            f = (1 - d / R) * CONFIG.repulseForce;
            p.x += (dx / d) * f;
            p.y += (dy / d) * f;
          }
        }
      }
    }

    function draw() {
      var D = CONFIG.linkDistance, D2 = D * D, c = CONFIG.color, i, j, a, b, dx, dy, d2, alpha;
      ctx.clearRect(0, 0, w, h);

      ctx.lineWidth = 1;
      for (i = 0; i < parts.length; i++) {
        a = parts[i];
        for (j = i + 1; j < parts.length; j++) {
          b = parts[j];
          dx = a.x - b.x;
          dy = a.y - b.y;
          d2 = dx * dx + dy * dy;
          if (d2 < D2) {
            alpha = (1 - Math.sqrt(d2) / D) * CONFIG.linkOpacity;
            ctx.strokeStyle = 'rgba(' + c + ',' + alpha.toFixed(3) + ')';
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      ctx.fillStyle = 'rgba(' + c + ',' + CONFIG.opacity + ')';
      ctx.beginPath();
      for (i = 0; i < parts.length; i++) {
        a = parts[i];
        ctx.moveTo(a.x + a.r, a.y);
        ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2);
      }
      ctx.fill();
    }

    function loop() {
      step();
      draw();
      raf = window.requestAnimationFrame(loop);
    }

    var resizeTimer = 0;
    window.addEventListener('resize', function () {
      window.cancelAnimationFrame(resizeTimer);
      resizeTimer = window.requestAnimationFrame(resize);
    });

    resize();

    // Visitors who prefer reduced motion get a still background with no interaction
    if (reduceMotion) { return; }

    raf = window.requestAnimationFrame(loop);

    // Pause while the tab is hidden to save battery
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { window.cancelAnimationFrame(raf); raf = 0; }
      else if (!raf) { raf = window.requestAnimationFrame(loop); }
    });

    // Cursor repulsion (the canvas ignores pointer events, so listen on the window)
    window.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') { return; }
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.on = true;
    }, { passive: true });
    document.documentElement.addEventListener('mouseleave', function () { pointer.on = false; });

    // Click on empty space adds a few particles; links, buttons and form fields are left alone
    window.addEventListener('click', function (e) {
      if (e.target.closest && e.target.closest('a, button, input, textarea, select, label, dialog')) { return; }
      for (var k = 0; k < CONFIG.clickAdd; k++) { parts.push(make(e.clientX, e.clientY)); }
      var limit = wanted() + CONFIG.maxExtra;
      if (parts.length > limit) { parts.splice(0, parts.length - limit); }
    });
  }

  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', start); }
  else { start(); }
})();

};
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",run);}else{run();}
})();
</script>
  <style>
/* ==========================================================
   Gallery page: styles that sit on top of the shared styles.css
   (palette variables, header, navigation and fonts come from there)
   1. Active nav  2. Header  3. Grid & tiles  4. Lightbox
   5. Footer  6. Motion & responsive
   ========================================================== */

/* ---------- 2. GALLERY HEADER ---------- */
.gallery-hero {
  padding: clamp(3.5rem, 9vw, 6rem) clamp(1rem, 5vw, 3rem) clamp(1.5rem, 4vw, 2.5rem);
  text-align: center;
  background:
    radial-gradient(ellipse 55% 60% at 50% 0%, rgba(0, 255, 255, 0.15), transparent 70%);
}
.eyebrow { margin-bottom: 1rem; color: var(--cyan); font: 500 0.95rem var(--font-head); letter-spacing: 0.4em; text-shadow: 0 0 12px rgba(0, 255, 255, 0.5); }
.gallery-hero h1 {
  font-size: clamp(2rem, 6.5vw, 4rem); font-weight: 700; letter-spacing: -0.02em;
  background: linear-gradient(120deg, #fff 25%, var(--cyan-light) 65%, var(--cyan));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 22px rgba(0, 255, 255, 0.22));
}
.intro { max-width: 52ch; margin: 1.25rem auto 0; color: var(--text-2); }
.glow-line {
  width: min(420px, 70%); height: 2px; margin: 2.25rem auto 0;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  box-shadow: 0 0 16px rgba(0, 255, 255, 0.6);
}

/* ---------- 3. GRID & TILES ---------- */
.gallery-section { max-width: var(--max); margin: 0 auto; padding: clamp(1.5rem, 4vw, 3rem) clamp(1rem, 5vw, 3rem) clamp(3rem, 8vw, 5.5rem); }
.gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(1rem, 2vw, 1.5rem); }

.tile {
  position: relative; display: block; width: 100%; padding: 0; overflow: hidden; cursor: pointer;
  aspect-ratio: 4 / 3;                 /* every slot has the same size */
  background: var(--bg-2); color: inherit; font: inherit;
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5), 0 0 14px rgba(0, 255, 255, 0.1);
  transition: border-color 0.35s, box-shadow 0.35s, transform 0.35s;
}
.tile img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s ease; }

/* Dark overlay with the title in light cyan */
.caption {
  position: absolute; inset: 0; display: flex; align-items: flex-end; padding: 1.25rem;
  background: linear-gradient(to top, rgba(5, 5, 5, 0.88), rgba(5, 5, 5, 0.35) 55%, transparent);
  color: var(--cyan-light); font: 500 1.15rem var(--font-head);
  text-shadow: 0 0 12px rgba(0, 255, 255, 0.5);
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.35s, transform 0.35s;
}

.tile:hover, .tile:focus-visible {
  border-color: var(--cyan);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 255, 255, 0.45);
  transform: translateY(-3px);
}
.tile:hover img, .tile:focus-visible img { transform: scale(1.06); }
.tile:hover .caption, .tile:focus-visible .caption { opacity: 1; transform: none; }
.tile:focus-visible { outline: 2px solid var(--cyan-light); outline-offset: 3px; }

/* Touch screens have no hover, so the title stays visible */
@media (hover: none) {
  .caption { opacity: 1; transform: none; background: linear-gradient(to top, rgba(5, 5, 5, 0.85), transparent 45%); }
}

/* ---------- 4. LIGHTBOX ---------- */
.lightbox {
  /* The dialog box hugs the image, so clicking anywhere else hits the backdrop and closes it */
  padding: 0; margin: auto; max-width: 94vw; max-height: 92vh; overflow: visible;
  background: #000; color: var(--text);
  border: 1px solid rgba(0, 255, 255, 0.45); border-radius: 16px;
  box-shadow: 0 0 40px rgba(0, 255, 255, 0.3), 0 20px 60px rgba(0, 0, 0, 0.8);
}
.lightbox::backdrop { background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(4px); }
.lightbox[open] { animation: lb-in 0.25s ease both; }
@keyframes lb-in { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: none; } }

.lb-figure { margin: 0; }
/* Large, fixed-width viewer; photos of any shape are fitted inside (letterboxed on black, never stretched) */
.lb-figure img { display: block; width: min(94vw, 1000px); height: auto; max-height: calc(92vh - 4.5rem); object-fit: contain; background: #000; border-radius: 15px 15px 0 0; }
.lb-figure figcaption {
  display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  padding: 0.9rem 1.25rem; color: var(--cyan-light); font: 500 1.1rem var(--font-head);
}
.lb-count { color: var(--text-2); font: 400 0.9rem var(--font-body); }

.lb-btn {
  position: absolute; display: grid; place-items: center; width: 46px; height: 46px; cursor: pointer;
  background: rgba(5, 5, 5, 0.75); color: var(--cyan); border: 1px solid var(--border); border-radius: 50%;
  font: 400 1.9rem/1 var(--font-body); transition: box-shadow 0.25s, border-color 0.25s, background 0.25s;
}
.lb-btn:hover, .lb-btn:focus-visible { border-color: var(--cyan); box-shadow: var(--glow); background: rgba(0, 255, 255, 0.12); outline: none; }
.lb-close { top: 0.75rem; right: 0.75rem; }
.lb-prev, .lb-next { top: calc(50% - 2.25rem); transform: translateY(-50%); }
.lb-prev { left: 0.75rem; }
.lb-next { right: 0.75rem; }

/* ---------- 5. FOOTER ---------- */
.mini-footer {
  padding: 2.25rem 1rem; text-align: center;
  background: var(--bg-2); border-top: 1px solid var(--border);
  color: var(--text-2); font-size: 0.95rem;
}
.mini-footer p { margin: 0 0 0.25rem; }
.mini-footer .brand { color: var(--cyan); font: 700 1.15rem var(--font-head); letter-spacing: 0.3em; text-shadow: 0 0 12px rgba(0, 255, 255, 0.5); }

/* ---------- 6. MOTION & RESPONSIVE ---------- */
.gallery-hero > * { animation: rise 0.8s ease both; }
.gallery-hero > :nth-child(2) { animation-delay: 0.1s; }
.gallery-hero > :nth-child(3) { animation-delay: 0.2s; }
.gallery-hero > :nth-child(4) { animation-delay: 0.3s; }
.gallery-grid li { animation: rise 0.6s ease both; animation-delay: calc(0.15s + var(--i) * 30ms); }

@media (max-width: 960px) {
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }      /* tablet */
}
@media (max-width: 600px) {
  .gallery-grid { grid-template-columns: 1fr; }                  /* mobile */
  .eyebrow { letter-spacing: 0.3em; }
  .lb-btn { width: 40px; height: 40px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>

    <button class="lb-btn lb-prev" type="button" id="lb-prev" aria-label="Previous photo">&#8249;</button>

  <script>
/* Gallery page script: lightbox viewer (the menu script is shared in script.js).
   No libraries needed. Photos are read from the <img> tags in gallery.html,
   so replacing a photo there also updates the viewer. */
(function () {
  'use strict';

  // ----- Lightbox -----
  var tiles = Array.prototype.slice.call(document.querySelectorAll('.tile'));
  var box = document.getElementById('lightbox');
  var img = document.getElementById('lb-img');
  var title = document.getElementById('lb-title');
  var count = document.getElementById('lb-count');
  var current = 0;

  function show(i) {
    current = (i + tiles.length) % tiles.length;            // wraps around at both ends
    var thumb = tiles[current].querySelector('img');
    img.src = thumb.getAttribute('data-full') || thumb.src;  // optional larger file: data-full="..."
    img.alt = thumb.alt;
    title.textContent = tiles[current].querySelector('.caption').textContent;
    count.textContent = (current + 1) + ' / ' + tiles.length;
  }

  function open(i) {
    show(i);
    if (typeof box.showModal === 'function') { box.showModal(); }
    else { box.setAttribute('open', ''); }
    document.body.style.overflow = 'hidden';
  }

  function close() {
    if (typeof box.close === 'function') { box.close(); } else { box.removeAttribute('open'); }
  }

  tiles.forEach(function (tile, i) {
    tile.addEventListener('click', function () { open(i); });
  });

  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', function () { show(current - 1); });
  document.getElementById('lb-next').addEventListener('click', function () { show(current + 1); });

  // Click outside the image (on the backdrop) closes the viewer
  box.addEventListener('click', function (e) { if (e.target === box) { close(); } });

  // Restore page scrolling whenever the viewer closes (button, Esc or backdrop)
  box.addEventListener('close', function () { document.body.style.overflow = ''; });

  // Keyboard: arrows to navigate (Esc closes natively)
  document.addEventListener('keydown', function (e) {
    if (!box.open) { return; }
    if (e.key === 'ArrowLeft') { show(current - 1); }
    else if (e.key === 'ArrowRight') { show(current + 1); }
  });

  // Touch: swipe left/right inside the viewer
  var startX = null;
  box.addEventListener('touchstart', function (e) { startX = e.changedTouches[0].clientX; }, { passive: true });
  box.addEventListener('touchend', function (e) {
    if (startX === null) { return; }
    var dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) { show(current + (dx < 0 ? 1 : -1)); }
    startX = null;
  }, { passive: true });
})();
</script>
